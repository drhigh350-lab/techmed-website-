name: Rebuild on Sanity publish

# Fired by a Sanity webhook (see web/scripts/assets/README.md's sibling doc,
# or the setup notes in the PR/commit this workflow shipped with) calling
# GitHub's repository_dispatch API whenever content is published in Sanity
# Studio. This is a static site — content is fetched at build time, not at
# request time — so a Sanity publish alone never changes what's live. All
# this job does is push a trivial commit, which Cloudflare's existing
# git-push-triggered build already picks up and deploys.
on:
  repository_dispatch:
    types: [sanity-content-published]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astro-foundation

      - name: Push an empty commit to trigger Cloudflare's build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Rebuild: Sanity content published"
          git push origin astro-foundation
