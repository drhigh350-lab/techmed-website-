name: Deploy Sanity Studio

# Publishes the Studio (techmed.sanity.studio) whenever its schema changes on
# main, so new content types (e.g. Quizzes, Class Links) appear for editors.
# Needs a repository secret SANITY_AUTH_TOKEN: a Sanity API token with
# "Deploy Studio" permission (sanity.io/manage -> API -> Tokens).
on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Studio dependencies (Studio only, outside the monorepo workspace)
        run: |
          cp -r studio "$RUNNER_TEMP/studio"
          cd "$RUNNER_TEMP/studio"
          for attempt in 1 2 3; do
            npm install --no-audit --no-fund && break
            echo "npm install failed (attempt $attempt), retrying in 20s"
            npm cache clean --force || true
            sleep 20
          done
          test -d node_modules/sanity
      - name: Deploy Studio
        working-directory: ${{ runner.temp }}/studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::Add the SANITY_AUTH_TOKEN repository secret (Sanity token with Deploy Studio permission)."
            exit 1
          fi
          npx sanity deploy --yes
